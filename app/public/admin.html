<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa Abierta · Administración</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Administración</h1>
    <p class="sub">Todo lo que se edita acá se ve en la carta al instante.</p>

    <h2>Datos del local</h2>
    <div class="panel" id="local"></div>

    <h2>Carta</h2>
    <div class="fila" style="margin-bottom:10px">
      <button class="primario" id="btn-nuevo">+ Producto nuevo</button>
    </div>
    <div class="panel" style="padding:0;overflow:auto">
      <table class="movimientos" id="tabla-menu"></table>
    </div>

    <h2>Caja del turno</h2>
    <div class="kpis" id="caja-kpis"></div>
    <div class="panel" style="padding:0;overflow:auto">
      <table class="movimientos" id="tabla-caja"></table>
    </div>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
