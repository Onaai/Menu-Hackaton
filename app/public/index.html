<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa Abierta · Carta</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <div class="columnas">
      <section>
        <h1>Carta</h1>
        <p class="sub" id="contexto">Cargando…</p>

        <div class="fila" style="margin-bottom:18px">
          <label class="chip">Mesa
            <select id="sel-mesa" style="border:none;background:transparent;padding:0 0 0 4px"></select>
          </label>
          <label class="chip">Soy
            <select id="sel-comensal" style="border:none;background:transparent;padding:0 0 0 4px"></select>
          </label>
          <label class="chip"><input type="checkbox" id="chk-celiaco"> Soy celíaco</label>
          <label class="chip"><input type="checkbox" id="chk-vegano"> Vegano</label>
        </div>

        <div id="carta"></div>
      </section>

      <aside>
        <div class="panel carrito">
          <h3 id="titulo-carrito">Mi pedido</h3>
          <div id="lineas"><p class="vacio">Todavía no elegiste nada.</p></div>
          <div id="totales"></div>
          <div class="fila" style="margin-top:14px">
            <button class="primario" id="btn-enviar" style="flex:1" disabled>Enviar a cocina</button>
          </div>
          <hr style="border:none;border-top:1px solid var(--borde);margin:18px 0">
          <div id="cuenta"></div>
        </div>
      </aside>
    </div>
  </main>

  <dialog id="dlg">
    <div class="contenido" id="dlg-cuerpo"></div>
    <div class="pie">
      <button id="dlg-cancelar">Cancelar</button>
      <button class="primario" id="dlg-agregar">Agregar</button>
    </div>
  </dialog>

  <script type="module" src="carta.js"></script>
</body>
</html>
